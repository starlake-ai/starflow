name: Launcher tests
# Runs the real distrib/starlake.sh with spark-submit, java and curl stubbed: no build, no
# network. macOS is here for its BSD tools and its old bash, which the launcher must support.
# The JDKs are for the tests with a real JVM: whether it accepts an AppCDS archive depends on
# its version. 21 rejects a classpath that 17 and 25 accept.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - branch-*
    paths:
      - 'distrib/starlake.sh'
      - 'distrib/starlake.cmd'
      - 'src/test/shell/**'
      - '.github/workflows/launcher-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'distrib/starlake.sh'
      - 'distrib/starlake.cmd'
      - 'src/test/shell/**'
      - '.github/workflows/launcher-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Run the launcher tests
        run: bats src/test/shell/starlake_appcds.bats

  # distrib/starlake.cmd has no stubs: it installs a real release and runs a real JVM.
  windows:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SL_VERSION: '1.8.15'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Detection of the run connection
        shell: powershell
        run: ./src/test/shell/starlake_cmd_c1.ps1
      - name: Launcher on Windows
        shell: powershell
        run: ./src/test/shell/starlake_cmd_windows.ps1
