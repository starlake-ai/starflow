name: Launcher tests
# Runs the real distrib/starlake.sh with spark-submit, java and curl stubbed: no build, no
# network. macOS is here for its BSD tools and its old bash, which the launcher must support.
# The JDKs are for the tests with a real JVM: whether it accepts an AppCDS archive depends on
# its version. 21 rejects a classpath that 17 and 25 accept.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - branch-*
    paths:
      - 'distrib/starlake.sh'
      - 'distrib/starlake.cmd'
      - 'distrib/setup.sh'
      - 'src/test/shell/**'
      - '.github/workflows/launcher-tests.yml'
  push:
    branches:
      - master
    paths:
      - 'distrib/starlake.sh'
      - 'distrib/starlake.cmd'
      - 'distrib/setup.sh'
      - 'src/test/shell/**'
      - '.github/workflows/launcher-tests.yml'

permissions:
  contents: read

jobs:
  bats:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '21', '25']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Run the launcher tests
        run: bats src/test/shell/starlake_appcds.bats

  # distrib/starlake.cmd has no stubs: it installs a real release and runs a real JVM.
  windows:
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      # Not a fixed version: old releases get deleted, and the install then fails with a 404. Looked
      # up here because this call has a token, while the one Setup makes can hit the rate limit.
      - name: Find the latest release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or -not $tag) { exit 1 }
          Write-Host "Installing $tag"
          "SL_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Setup downloads Spark through an Apache mirror, which gave 0.1 MB/s here, and skips it when
      # bin\spark exists. All the rest of the install stays real.
      - id: spark-cache
        uses: actions/cache/restore@v4
        with:
          path: spark-dist
          key: spark-4.1.3-bin-hadoop3
      - name: Provide Spark
        shell: powershell
        run: |
          if (-not (Test-Path spark-dist\spark.tgz)) {
            New-Item -ItemType Directory -Force spark-dist | Out-Null
            curl.exe -fsSL --retry 3 -o spark-dist\spark.tgz https://archive.apache.org/dist/spark/spark-4.1.3/spark-4.1.3-bin-hadoop3.tgz
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          New-Item -ItemType Directory -Force C:\sl\bin | Out-Null
          tar -xzf spark-dist\spark.tgz -C C:\sl\bin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Rename-Item C:\sl\bin\spark-4.1.3-bin-hadoop3 spark
          Rename-Item C:\sl\bin\spark\conf\log4j2.properties.template log4j2.properties
      # Saved here rather than at the end of the job, which would save nothing when a test fails.
      - if: steps.spark-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: spark-dist
          key: spark-4.1.3-bin-hadoop3
      - name: Detection of the run connection
        shell: powershell
        run: ./src/test/shell/starlake_cmd_c1.ps1
      - name: Launcher on Windows
        shell: powershell
        run: ./src/test/shell/starlake_cmd_windows.ps1

  windows-stubbed:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Proxy flags of starlake.cmd
        shell: powershell
        run: ./src/test/shell/starlake_cmd_proxy.ps1
