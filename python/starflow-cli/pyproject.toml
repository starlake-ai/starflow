[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starflow"
dynamic = ["version"]
description = "Launcher for Starlake Starflow, the declarative data pipeline tool: run the Starflow UI with `uvx starflow serve` (no install, auto-connects to a local Quack on Demand)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Starlake", email = "contact@starlake.ai" }]
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://starlake.ai"
Documentation = "https://docs.starlake.ai/starflow"
Source = "https://github.com/starlake-ai/starflow"

[project.scripts]
starflow = "starflow_cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.version]
path = "src/starflow_cli/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".venv*", "dist", "**/__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/starflow_cli"]
