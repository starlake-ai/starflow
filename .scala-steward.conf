# Libraries pinned to what Spark ships (check spark-<version>-bin-hadoop3/jars) move with
# Spark, by hand, never on their own.
updates.ignore = [
  { groupId = "com.fasterxml.jackson.core" },
  { groupId = "com.fasterxml.jackson.databind" },
  { groupId = "com.fasterxml.jackson.jaxrs" },
  { groupId = "com.fasterxml.jackson.module" },
  { groupId = "com.fasterxml.jackson.dataformat" },
  { groupId = "com.fasterxml.jackson.datatype" },
  { groupId = "com.google.guava", artifactId = "guava" },
  { groupId = "org.scala-lang.modules", artifactId = "scala-parallel-collections" },
  { groupId = "org.apache.poi", artifactId = "poi-ooxml" },
  # held at 2.0.0 after a regression during release
  { groupId = "com.github.sbt", artifactId = "sbt-git" }
]

# Version prefixes: updates stay within these lines.
updates.pin = [
  # Scala 2.13 only; Spark has no Scala 3 build
  { groupId = "org.scala-lang", version = "2.13." },
  # json-schema-validator 3.x is built on Jackson 3, incompatible with the Spark classpath
  { groupId = "com.networknt", artifactId = "json-schema-validator", version = "2." },
  # sbt 2 is a migration of its own
  { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." }
]
