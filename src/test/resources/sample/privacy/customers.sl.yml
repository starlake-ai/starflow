---
version: 1
table:
  name: "customers"
  pattern: "customers.*.dsv"
  metadata:
    format: "DSV"
    withHeader: true
    separator: ";"
  attributes:
    - name: "id"
      type: "long"
      required: true
    - name: "email"
      type: "string"
      privacy: "SHA256"
    - name: "name"
      type: "string"
      privacy: "HIDE"
    - name: "phone"
      type: "string"
      privacy: "MD5"
    - name: "city"
      type: "string"
      privacy: "SQL: UPPER(city)"
    - name: "nickname"
      type: "string"
      privacy: "HIDE10X"
    - name: "fullname"
      type: "string"
      privacy: "INITIALS"
    - name: "code"
      type: "string"
      trim: "BOTH"
      privacy: "SHA256"
    - name: "score"
      type: "long"
      privacy: "HIDE"
    - name: "amount"
      type: "long"
      privacy: "APPROXLONG20"
    - name: "token"
      type: "string"
      privacy: "APPROXLONG20"
