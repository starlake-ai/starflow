---
version: 1
table:
  name: "typed_two_steps"
  pattern: "typed_two_steps-.*.json"
  attributes:
    - name: "id"
      type: "long"
      required: true
    - name: "civil"
      type: "civil_datetime"
    - name: "wall"
      type: "wall_time"
    - name: "payload"
      type: "json_text"
    - name: "area"
      type: "area"
    - name: "code"
      type: "code10"
    - name: "amount"
      type: "decimal"
    - name: "tags"
      type: "string"
      array: true
    - name: "dropped"
      type: "string"
      ignore: true
