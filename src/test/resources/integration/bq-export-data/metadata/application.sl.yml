version: 1
application:
  connectionRef: "bigquery"
  loader: "native"
  connections:
    bigquery:
      type: "bigquery"
      options:
        location: "europe-west1"
        authType: "APPLICATION_DEFAULT"
        authScopes: "https://www.googleapis.com/auth/cloud-platform"
    # The sink of the transforms that BigQuery exports to Cloud Storage
    gcs:
      type: "fs"
